# Deployed to /var/lib/pihole/dnsmasq/05-local-records.conf on core1 (mounted as /etc/dnsmasq.d).
# Marks the hub hostnames as local: Pi-hole never forwards any record type for them.
# A records come from custom.list, AAAA and other types get an empty answer instead
# of the public wildcard CNAME (dnsmasq >= 2.86 would otherwise forward them).
# Keep in sync with custom.list. Apply with: pihole restartdns
local=/core1.reihungen.de/home.reihungen.de/paperless.reihungen.de/photos.reihungen.de/pihole.reihungen.de/spoolman.reihungen.de/
local=/core2.reihungen.de/jellyfin.reihungen.de/jellyseerr.reihungen.de/radarr.reihungen.de/sonarr.reihungen.de/prowlarr.reihungen.de/sabnzbd.reihungen.de/
